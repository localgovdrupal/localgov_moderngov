localgov_moderngov.modern_gov:
  path: '/moderngov-template'
  defaults:
    _controller: json_decode
    _title: '{pagetitle}'
    json: '[]'
    assoc: 1
    depth: 2
    options: 3
  # These templates are almost always consumed by anonymous users making
  # BigPipe unnecessary.
  options:
    _no_big_pipe: TRUE
  requirements:
    _permission: 'access content'
